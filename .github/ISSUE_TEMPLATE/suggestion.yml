name: Suggestion
description: Propose an improvement to the guide
title: "[Suggestion] "
labels:
  - suggestion
body:
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or missing?
      description: Describe the gap from a beginner point of view.
      placeholder: The current section does not explain...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Share the exact wording or structure you suggest.
      placeholder: I suggest changing this section to...
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why this helps
      description: Explain the practical benefit.
      placeholder: This helps beginners by...
    validations:
      required: true
